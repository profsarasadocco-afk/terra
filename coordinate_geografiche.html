<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latitudine e Longitudine - Modello 3D Interattivo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            color: #1e293b;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            width: 340px;
            border: 1px solid #e2e8f0;
        }
        h2 {
            margin: 0 0 12px 0;
            font-size: 18px;
            color: #0f172a;
        }
        .control-group {
            margin-bottom: 14px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 14px;
        }
        button {
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #e2e8f0;
            color: #334155;
        }
        button:hover {
            background-color: #cbd5e1;
        }
        button.active {
            background-color: #0284c7;
            color: white;
        }
        .legend {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
            line-height: 1.5;
        }
        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .hint {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 12px;
            color: #64748b;
            background: rgba(255,255,255,0.85);
            padding: 6px 12px;
            border-radius: 20px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="controls">
    <h2>Coordinate Geografiche 3D</h2>
    
    <div class="control-group">
        <label>
            <span>Latitudine (φ):</span>
            <span id="lat-val" style="color: #d97706;">45° N</span>
        </label>
        <input type="range" id="lat-slider" min="-80" max="80" value="45">
    </div>

    <div class="control-group">
        <label>
            <span>Longitudine (λ):</span>
            <span id="lon-val" style="color: #059669;">50° E</span>
        </label>
        <input type="range" id="lon-slider" min="-175" max="175" value="50">
    </div>

    <div class="btn-group">
        <button id="btn-anim-lon">▶ Muovi P sul Parallelo (Latitudine fissa)</button>
        <button id="btn-anim-lat">▶ Muovi P sul Meridiano (Longitudine fissa)</button>
        <button id="btn-stop" class="active">⏸ Controllo Manuale</button>
    </div>

    <div class="legend">
        <div><span class="dot" style="background:#dc2626;"></span><strong>Punto P</strong> sulla superficie terrestre</div>
        <div><span class="dot" style="background:#eab308;"></span><strong>Latitudine:</strong> vertice al <u>centro della Terra</u></div>
        <div><span class="dot" style="background:#10b981;"></span><strong>Longitudine:</strong> vertice sull'<u>asse di rotazione</u> (centro del parallelo)</div>
    </div>
</div>

<div class="hint">Trascina con il mouse per ruotare • Rotellina per zoom</div>
<div id="canvas-container"></div>

<script>
    // --- INIZIALIZZAZIONE SCENA ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f7f9);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(10, 6.5, 13.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // --- LUCI ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    const R = 5; // Raggio terrestre

    // --- SFERA SEMITRASPARENTE ---
    const earthSphere = new THREE.Mesh(
        new THREE.SphereGeometry(R, 64, 64),
        new THREE.MeshPhongMaterial({
            color: 0xbae6fd,
            transparent: true,
            opacity: 0.32,
            depthWrite: false,
            side: THREE.DoubleSide
        })
    );
    scene.add(earthSphere);

    // --- ASSE DI ROTAZIONE ---
    const axisGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, -R - 1.5, 0),
        new THREE.Vector3(0, R + 1.5, 0)
    ]);
    const axisLine = new THREE.Line(
        axisGeo,
        new THREE.LineDashedMaterial({ color: 0x334155, dashSize: 0.2, gapSize: 0.15 })
    );
    axisLine.computeLineDistances();
    scene.add(axisLine);

    // --- RETICOLATO GEOGRAFICO ---
    const gridGroup = new THREE.Group();
    scene.add(gridGroup);

    function createCirclePoints(radius, segments, isHorizontal, valueRad) {
        const points = [];
        for (let i = 0; i <= segments; i++) {
            const theta = (i / segments) * Math.PI * 2;
            if (isHorizontal) {
                points.push(new THREE.Vector3(
                    radius * Math.sin(theta),
                    valueRad,
                    radius * Math.cos(theta)
                ));
            } else {
                points.push(new THREE.Vector3(
                    radius * Math.sin(theta) * Math.sin(valueRad),
                    radius * Math.cos(theta),
                    radius * Math.sin(theta) * Math.cos(valueRad)
                ));
            }
        }
        return points;
    }

    // Paralleli ogni 15°
    for (let lat = -75; lat <= 75; lat += 15) {
        const phi = THREE.MathUtils.degToRad(lat);
        const r = R * Math.cos(phi);
        const y = R * Math.sin(phi);
        const isEquator = (lat === 0);
        const mat = new THREE.LineBasicMaterial({
            color: isEquator ? 0xdc2626 : 0xffffff,
            transparent: true,
            opacity: isEquator ? 0.95 : 0.65
        });
        gridGroup.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(createCirclePoints(r, 64, true, y)),
            mat
        ));
    }

    // Meridiani ogni 15° (semicerchi da Polo Nord a Polo Sud)
    for (let lon = -165; lon <= 180; lon += 15) {
        const lambda = THREE.MathUtils.degToRad(lon);
        const isGreenwich = (lon === 0);
        const mat = new THREE.LineBasicMaterial({
            color: isGreenwich ? 0xdc2626 : 0xffffff,
            transparent: true,
            opacity: isGreenwich ? 0.95 : 0.65
        });
        const pts = [];
        for (let i = 0; i <= 48; i++) {
            const polar = (i / 48) * Math.PI; // da 0 (Polo Nord) a PI (Polo Sud)
            pts.push(new THREE.Vector3(
                R * Math.sin(polar) * Math.sin(lambda),
                R * Math.cos(polar),
                R * Math.sin(polar) * Math.cos(lambda)
            ));
        }
        gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
    }

    // --- ELEMENTI DINAMICI ---
    const dynamicGroup = new THREE.Group();
    scene.add(dynamicGroup);

    // 1. Punto P
    const pointP = new THREE.Mesh(
        new THREE.SphereGeometry(0.18, 24, 24),
        new THREE.MeshBasicMaterial({ color: 0xdc2626 })
    );
    // 2. Vertice Latitudine (Centro della Terra O)
    const vertexLat = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xd97706 })
    );
    // 3. Vertice Longitudine (Centro del parallelo C sull'asse di rotazione)
    const vertexLon = new THREE.Mesh(
        new THREE.SphereGeometry(0.14, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0x059669 })
    );
    dynamicGroup.add(pointP, vertexLat, vertexLon);

    // Linee tratteggiate di riferimento (parallelo e meridiano di P)
    const activeParallelLine = new THREE.Line(
        new THREE.BufferGeometry(),
        new THREE.LineDashedMaterial({ color: 0x059669, dashSize: 0.16, gapSize: 0.1 })
    );
    const activeMeridianLine = new THREE.Line(
        new THREE.BufferGeometry(),
        new THREE.LineDashedMaterial({ color: 0xd97706, dashSize: 0.16, gapSize: 0.1 })
    );
    dynamicGroup.add(activeParallelLine, activeMeridianLine);

    // Raggi che delimitano i due settori angolari (per chiarezza geometrica)
    const latRaysLine = new THREE.LineSegments(
        new THREE.BufferGeometry(),
        new THREE.LineBasicMaterial({ color: 0xb45309 })
    );
    const lonRaysLine = new THREE.LineSegments(
        new THREE.BufferGeometry(),
        new THREE.LineBasicMaterial({ color: 0x047857 })
    );
    dynamicGroup.add(latRaysLine, lonRaysLine);

    // Settori angolari e archi rossi
    const latSectorMesh = new THREE.Mesh();
    const lonSectorMesh = new THREE.Mesh();
    const latArcMesh = new THREE.Mesh();
    const lonArcMesh = new THREE.Mesh();
    dynamicGroup.add(latSectorMesh, lonSectorMesh, latArcMesh, lonArcMesh);

    // Helper per costruire un settore circolare planare tra due punti rispetto a un vertice
    function buildPlanarSector(vertex, pStart, pEnd, customRadius = null, segments = 32) {
        const v1 = new THREE.Vector3().subVectors(pStart, vertex);
        const v2 = new THREE.Vector3().subVectors(pEnd, vertex);
        const radius = customRadius !== null ? customRadius : v1.length();
        const angle = v1.angleTo(v2);

        if (angle < 0.005 || radius < 0.01) return new THREE.BufferGeometry();

        const axis = new THREE.Vector3().crossVectors(v1, v2).normalize();
        const dirStart = v1.clone().normalize();
        const vertices = [];

        for (let i = 0; i < segments; i++) {
            const a1 = (i / segments) * angle;
            const a2 = ((i + 1) / segments) * angle;
            const pt1 = dirStart.clone().applyAxisAngle(axis, a1).multiplyScalar(radius).add(vertex);
            const pt2 = dirStart.clone().applyAxisAngle(axis, a2).multiplyScalar(radius).add(vertex);

            vertices.push(vertex.x, vertex.y, vertex.z);
            vertices.push(pt1.x, pt1.y, pt1.z);
            vertices.push(pt2.x, pt2.y, pt2.z);
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geo.computeVertexNormals();
        return geo;
    }

    // --- AGGIORNAMENTO GEOMETRIA ---
    function updateGeometry(latDeg, lonDeg) {
        const phi = THREE.MathUtils.degToRad(latDeg);
        const lambda = THREE.MathUtils.degToRad(lonDeg);

        const rParallel = R * Math.cos(phi);
        const yP = R * Math.sin(phi);
        const xP = rParallel * Math.sin(lambda);
        const zP = rParallel * Math.cos(lambda);

        // Punti chiave
        const posP = new THREE.Vector3(xP, yP, zP);
        const originO = new THREE.Vector3(0, 0, 0); // Vertice Latitudine (Centro Terra)
        const centerC = new THREE.Vector3(0, yP, 0); // Vertice Longitudine (Sull'asse di rotazione)
        
        const posEquatorMeridian = new THREE.Vector3(R * Math.sin(lambda), 0, R * Math.cos(lambda));
        const posGreenwichParallel = new THREE.Vector3(0, yP, rParallel);

        // Posiziona sfere vertice
        pointP.position.copy(posP);
        vertexLat.position.copy(originO);
        vertexLon.position.copy(centerC);

        // Aggiorna parallelo di P
        activeParallelLine.geometry.dispose();
        activeParallelLine.geometry = new THREE.BufferGeometry().setFromPoints(
            createCirclePoints(rParallel, 64, true, yP)
        );
        activeParallelLine.computeLineDistances();

        // Aggiorna meridiano di P (semicerchio)
        const merPts = [];
        for (let i = 0; i <= 48; i++) {
            const polar = (i / 48) * Math.PI;
            merPts.push(new THREE.Vector3(
                R * Math.sin(polar) * Math.sin(lambda),
                R * Math.cos(polar),
                R * Math.sin(polar) * Math.cos(lambda)
            ));
        }
        activeMeridianLine.geometry.dispose();
        activeMeridianLine.geometry = new THREE.BufferGeometry().setFromPoints(merPts);
        activeMeridianLine.computeLineDistances();

        // --- 1. ANGOLO DI LATITUDINE (Vertice in O(0,0,0)) ---
        latRaysLine.geometry.dispose();
        latRaysLine.geometry = new THREE.BufferGeometry().setFromPoints([
            originO, posEquatorMeridian,
            originO, posP
        ]);

        latSectorMesh.geometry.dispose();
        latSectorMesh.geometry = buildPlanarSector(originO, posEquatorMeridian, posP);
        latSectorMesh.material = new THREE.MeshBasicMaterial({
            color: 0xeab308,
            transparent: true,
            opacity: 0.45,
            side: THREE.DoubleSide,
            depthWrite: false
        });

        latArcMesh.geometry.dispose();
        latArcMesh.geometry = buildPlanarSector(originO, posEquatorMeridian, posP, 1.35);
        latArcMesh.material = new THREE.MeshBasicMaterial({
            color: 0xb91c1c,
            side: THREE.DoubleSide
        });

        // --- 2. ANGOLO DI LONGITUDINE (Vertice in C(0, yP, 0) sull'asse di rotazione!) ---
        lonRaysLine.geometry.dispose();
        lonRaysLine.geometry = new THREE.BufferGeometry().setFromPoints([
            centerC, posGreenwichParallel,
            centerC, posP
        ]);

        lonSectorMesh.geometry.dispose();
        lonSectorMesh.geometry = buildPlanarSector(centerC, posGreenwichParallel, posP);
        lonSectorMesh.material = new THREE.MeshBasicMaterial({
            color: 0x10b981,
            transparent: true,
            opacity: 0.45,
            side: THREE.DoubleSide,
            depthWrite: false
        });

        const arcLonR = Math.min(1.25, rParallel * 0.55);
        lonArcMesh.geometry.dispose();
        lonArcMesh.geometry = buildPlanarSector(centerC, posGreenwichParallel, posP, arcLonR);
        lonArcMesh.material = new THREE.MeshBasicMaterial({
            color: 0xb91c1c,
            side: THREE.DoubleSide
        });
    }

    // --- CONTROLLI UI ---
    const latSlider = document.getElementById('lat-slider');
    const lonSlider = document.getElementById('lon-slider');
    const latVal = document.getElementById('lat-val');
    const lonVal = document.getElementById('lon-val');

    const btnAnimLon = document.getElementById('btn-anim-lon');
    const btnAnimLat = document.getElementById('btn-anim-lat');
    const btnStop = document.getElementById('btn-stop');

    let animMode = 'none';
    let latDirection = 1;

    function updateLabels(lat, lon) {
        const latDir = lat >= 0 ? 'N' : 'S';
        const lonDir = lon >= 0 ? 'E' : 'O';
        latVal.textContent = `${Math.abs(Math.round(lat))}° ${latDir}`;
        lonVal.textContent = `${Math.abs(Math.round(lon))}° ${lonDir}`;
    }

    function setActiveButton(activeBtn) {
        [btnAnimLon, btnAnimLat, btnStop].forEach(b => b.classList.remove('active'));
        activeBtn.classList.add('active');
    }

    btnAnimLon.addEventListener('click', () => { animMode = 'lon'; setActiveButton(btnAnimLon); });
    btnAnimLat.addEventListener('click', () => { animMode = 'lat'; setActiveButton(btnAnimLat); });
    btnStop.addEventListener('click', () => { animMode = 'none'; setActiveButton(btnStop); });

    latSlider.addEventListener('input', () => {
        animMode = 'none';
        setActiveButton(btnStop);
        const lat = parseFloat(latSlider.value);
        const lon = parseFloat(lonSlider.value);
        updateLabels(lat, lon);
        updateGeometry(lat, lon);
    });

    lonSlider.addEventListener('input', () => {
        animMode = 'none';
        setActiveButton(btnStop);
        const lat = parseFloat(latSlider.value);
        const lon = parseFloat(lonSlider.value);
        updateLabels(lat, lon);
        updateGeometry(lat, lon);
    });

    // Stato iniziale coerente con l'immagine di esempio
    updateLabels(45, 50);
    updateGeometry(45, 50);

    // --- LOOP ANIMAZIONE ---
    function animate() {
        requestAnimationFrame(animate);

        let currentLat = parseFloat(latSlider.value);
        let currentLon = parseFloat(lonSlider.value);

        if (animMode === 'lon') {
            currentLon += 0.6;
            if (currentLon > 175) currentLon = -175;
            lonSlider.value = currentLon;
            updateLabels(currentLat, currentLon);
            updateGeometry(currentLat, currentLon);
        } else if (animMode === 'lat') {
            currentLat += 0.35 * latDirection;
            if (currentLat >= 80) { currentLat = 80; latDirection = -1; }
            if (currentLat <= -80) { currentLat = -80; latDirection = 1; }
            latSlider.value = currentLat;
            updateLabels(currentLat, currentLon);
            updateGeometry(currentLat, currentLon);
        }

        controls.update();
        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
<div style="position: fixed; bottom: 14px; left: 20px; font-family: 'Segoe UI', sans-serif; font-size: 12px; color: rgba(255, 255, 255, 0.7); background: rgba(15, 23, 42, 0.55); padding: 6px 12px; border-radius: 20px; pointer-events: none; z-index: 100;">
    Progetto didattico di <strong>Sara Sadocco</strong> • Sviluppo interattivo con Gemini
</div>
</body>
</html>
